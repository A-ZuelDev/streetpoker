[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "streetpoker"
version = "0.1.0"
description = "Authoritative backend foundation for StreetPoker"
requires-python = "==3.14.*"
dependencies = [
    "alembic",
    "fastapi",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "hypothesis",
    "mypy",
    "pytest",
    "ruff",
    "setuptools",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = ["integration: requires a running PostgreSQL instance"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
files = ["src"]
