name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: streetpoker
          POSTGRES_USER: streetpoker
          POSTGRES_PASSWORD: streetpoker_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U streetpoker -d streetpoker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STREETPOKER_ENVIRONMENT: test
      STREETPOKER_DATABASE_URL: postgresql+psycopg://streetpoker:streetpoker_dev@127.0.0.1:5432/streetpoker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e "backend[dev]"
      - name: Validate Alembic
        run: python -m alembic -c backend/alembic.ini upgrade head
      - name: Lint
        run: python -m ruff check backend/src backend/tests backend/alembic
      - name: Check formatting
        run: python -m ruff format --check backend/src backend/tests backend/alembic
      - name: Type check
        run: python -m mypy backend/src
      - name: Test
        run: python -m pytest backend/tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Check formatting
        run: npm run format:check
        working-directory: frontend
      - name: Type check
        run: npm run typecheck
        working-directory: frontend
      - name: Test
        run: npm run test -- --run
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: streetpoker
          POSTGRES_USER: streetpoker
          POSTGRES_PASSWORD: streetpoker_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U streetpoker -d streetpoker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STREETPOKER_ENVIRONMENT: test
      STREETPOKER_DATABASE_URL: postgresql+psycopg://streetpoker:streetpoker_dev@127.0.0.1:5432/streetpoker
      VITE_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install application
        run: |
          python -m pip install -e "backend[dev]"
          npm ci --prefix frontend
      - name: Prepare database
        run: python -m alembic -c backend/alembic.ini upgrade head
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser smoke test
        run: |
          python -m uvicorn streetpoker.api.app:create_app --factory --app-dir backend/src --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid"' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/health
          npm --prefix frontend run test:e2e

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
