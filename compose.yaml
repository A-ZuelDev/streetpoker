name: streetpoker

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-streetpoker}
      POSTGRES_USER: ${POSTGRES_USER:-streetpoker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streetpoker_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-streetpoker} -d ${POSTGRES_DB:-streetpoker}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    stop_grace_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
